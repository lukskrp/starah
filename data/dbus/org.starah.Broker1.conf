<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- starahd owns org.starah.Broker1. Anyone may call it: starahd itself decides per
     method from the caller's uid (agents, polkitd, humans) and polkit. -->
<busconfig>
  <policy user="root">
    <allow own="org.starah.Broker1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.starah.Broker1"/>
  </policy>
</busconfig>
